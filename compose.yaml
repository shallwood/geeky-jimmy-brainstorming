services:
  brainstorming:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      PORT: 8080
      MCP_PUBLIC_ORIGIN: ${MCP_PUBLIC_ORIGIN:-https://notes.accountabilitybot.cc}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-8081}:8080"
    volumes:
      - brainstorming_data:/data
      - /etc/localtime:/etc/localtime:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  brainstorming_data:
